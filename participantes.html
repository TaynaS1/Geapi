<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAPE — Grupo de Estudos em Apicultura e Meliponicultura</title>
    <meta name="description" content="Centro de informações, objetivos e atividades do GAPE, grupo de estudos em apicultura e meliponicultura do IFSULDEMINAS.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo-link" aria-label="Página inicial do GAPE">
                <img src="logo.png" alt="Logo do GAPE" class="logo">
            </a>

            <button class="nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="navContainer">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-container" id="navContainer" aria-label="Navegação principal">
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="seminarios.html">Seminários</a></li>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="participantes.html" class="ativo" aria-current="page">Participantes</a></li>
                </ul>
            </nav>
        </div>
    </header>

     <section class="hero">
        <div class="hero-content"> 
            <h1 class="hero-title">Participantes</h1>
            <span
            class="hero-eyebrow">IFSULDEMINAS · Setor de Apicultura</span>
        </div>
    </section>

    <main class="container">

        <section class="participantes" id="participantes">
            <h2 class="section-title">Em Breve</h2>
            <div class="texto-card">
                <p>Esta página está em construção. Em breve você encontrará aqui os participantes, contribuições e histórias dos membros do GAPE.</p>
            </div>
        </section>

    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p><strong>GEAPI</strong></p>
            <span class="footer-sub">IFSULDEMINAS - Campus Machado</span>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const botao = document.getElementById("navToggle");
            const nav = document.getElementById("navContainer");

            if (!botao || !nav) return;

            botao.addEventListener("click", function () {
                const aberto = nav.classList.toggle("aberto");
                botao.setAttribute("aria-expanded", aberto ? "true" : "false");
            });

            nav.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function () {
                    nav.classList.remove("aberto");
                    botao.setAttribute("aria-expanded", "false");
                });
            });
        });
    </script>

</body>
</html>
